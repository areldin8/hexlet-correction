spring:
  application:
    name: hexletTypoReporter
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  mvc:
    hiddenmethod:
      filter:
        enabled: true
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          vk:
            client-id: ${VK_CLIENT_ID}
            client-secret: ${VK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: email
            client-name: VK
        provider:
          vk:
            authorization-uri: https://oauth.vk.com/authorize
            token-uri: https://oauth.vk.com/access_token
            user-info-uri: https://api.vk.com/method/users.get?fields=email,first_name,last_name&v=5.131
            user-name-attribute: id
  logging:
    level:
      org.springframework.security.oauth2.client: DEBUG
      org.springframework.web.client.RestTemplate: DEBUG
