<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">
    <div class="row">
        <div class="col">
            <div class="invalid-feedback" role="alert" th:if="${param.error}" th:text="#{alert.bad-credential}"></div>
            <div class="alert alert-warning" role="alert" th:if="${param.logout}" th:text="#{alert.logout}"></div>
            <form method="post" th:action="@{/login}">
                <div class="form-floating mb-3">
                    <input autofocus class="form-control" id="inputEmail"
                           name="email" placeholder="Email" required type="text">
                    <label for="inputEmail" th:text="#{email}"></label>
                </div>
                <div class="form-floating mb-3">
                    <input class="form-control" id="inputPassword" name="password"
                           placeholder="Password" required type="password">
                    <label for="inputPassword" th:text="#{password}"></label>
                </div>
                <button class="btn btn-primary" type="submit" th:text="#{btn.login}"></button>
            </form>
        </div>
    </div>
    <div>
        <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
        <script type="text/javascript">
            if ('VKIDSDK' in window) {
              const VKID = window.VKIDSDK;

              VKID.Config.init({
                app: 53673397,
                redirectUrl: 'https://937b1fc19272be.lhr.life/login/oauth/code/vk',
                responseMode: VKID.ConfigResponseMode.Callback,
                source: VKID.ConfigSource.LOWCODE,
                scope: '', // Заполните нужными доступами по необходимости
              });

              const oAuth = new VKID.OAuthList();

              oAuth.render({
                container: document.currentScript.parentElement,
                oauthList: [
                  'vkid'
                ]
              })
              .on(VKID.WidgetEvents.ERROR, vkidOnError)
              .on(VKID.OAuthListInternalEvents.LOGIN_SUCCESS, function (payload) {
                const code = payload.code;
                const deviceId = payload.device_id;

                VKID.Auth.exchangeCode(code, deviceId)
                  .then(vkidOnSuccess)
                  .catch(vkidOnError);
              });

              function vkidOnSuccess(data) {
                // Обработка полученного результата
              }

              function vkidOnError(error) {
                // Обработка ошибки
              }
            }
        </script>
    </div>
    <div class="row">
        <div class="mt-4">
            <a class="link-primary" th:href="@{/signup}" th:text="#{link.signup}"></a>
        </div>
    </div>
</div>
</html>
