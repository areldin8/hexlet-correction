spring:
  application:
    name: hexletTypoReporter
  security:
    oauth2:
      client:
        registration:
          vk:
            client-id: mock-vk-client
            client-secret: mock-secret
            redirect-uri: http://localhost:8080
            authorization-grant-type: authorization_code
            scope: email
            client-name: VK
        provider:
          vk:
            authorization-uri: https://oauth.vk.com/authorize
            token-uri: https://oauth.vk.com/access_token
            user-info-uri: https://api.vk.com/method/users.get?fields=email,first_name,last_name
            user-name-attribute: login
  jpa:
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        use_sql_comments: true
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  mvc:
    hiddenmethod:
      filter:
        enabled: true
    problemdetails:
      enabled: true

logging:
  level:
    root: INFO
    web: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.core.env: DEBUG
    io.hexlet.typoreporter: DEBUG
    # Bug in database rider, a lot of log 'warning'
    com.github.database.rider.core.api.dataset.ScriptableTable: ERROR
